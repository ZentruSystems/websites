<svg xmlns="http://www.w3.org/2000/svg" width="460" height="400" viewBox="0 0 460 400" fill="none">
	<title>The same hand movement, four times less pointer travel</title>
	<desc>Above each run, an identical dimension line: the hand moves exactly as far both times.
	Without the key the pointer overshoots the target and hunts for it; with the key held it covers a
	quarter of the distance and lands on it.</desc>
	<line x1="140" y1="136" x2="140" y2="338" stroke="#858585" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.45"/>

	<!-- without -->
	<g stroke="#858585" stroke-width="2" fill="none">
		<rect x="14" y="77" width="20" height="30" rx="10"/>
		<line x1="24" y1="84" x2="24" y2="90"/>
	</g>
	<g stroke="#858585" fill="#858585">
		<line x1="44" y1="92" x2="236" y2="92" stroke-width="2"/>
		<line x1="44" y1="81" x2="44" y2="103" stroke-width="1.5" opacity="0.75"/>
		<line x1="236" y1="81" x2="236" y2="103" stroke-width="1.5" opacity="0.75"/>
		<path d="M 44,92 l 10,-5.5 l 0,11 z" stroke="none"/>
		<path d="M 236,92 l -10,-5.5 l 0,11 z" stroke="none"/>
	</g>
	<line x1="44" y1="107" x2="44" y2="148" stroke="#858585" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.6"/>
	<path d="M 44,158 H 368 q 12,-9 24,0 q 12,9 24,0 q 8,-6 12,0" stroke="#a0a0a0" stroke-width="3" stroke-linecap="round"/>
	<circle cx="140" cy="158" r="9" stroke="#a0a0a0" stroke-width="2"/>
	<circle cx="140" cy="158" r="1.8" fill="#a0a0a0" stroke="none"/>
	<circle cx="44" cy="158" r="4.5" fill="#a0a0a0" stroke="none"/>
	<path d="M 0,0 L 0,17.5 L 4.2,13.4 L 6.9,19.6 L 10.1,18.2 L 7.4,12.1 L 12.6,11.6 Z" fill="#a0a0a0" stroke="none" transform="translate(428 158)"/>

	<!-- held -->
	<g stroke="#858585" stroke-width="2" fill="none">
		<rect x="14" y="235" width="20" height="30" rx="10"/>
		<line x1="24" y1="242" x2="24" y2="248"/>
	</g>
	<g stroke="#858585" fill="#858585">
		<line x1="44" y1="250" x2="236" y2="250" stroke-width="2"/>
		<line x1="44" y1="239" x2="44" y2="261" stroke-width="1.5" opacity="0.75"/>
		<line x1="236" y1="239" x2="236" y2="261" stroke-width="1.5" opacity="0.75"/>
		<path d="M 44,250 l 10,-5.5 l 0,11 z" stroke="none"/>
		<path d="M 236,250 l -10,-5.5 l 0,11 z" stroke="none"/>
	</g>
	<line x1="44" y1="265" x2="44" y2="306" stroke="#858585" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.6"/>
	<path d="M 44,316 H 140" stroke="#55f1a3" stroke-width="3" stroke-linecap="round"/>
	<circle cx="140" cy="316" r="16" stroke="#55f1a3" stroke-width="1.5" opacity="0.3"/>
	<circle cx="140" cy="316" r="9" stroke="#55f1a3" stroke-width="2"/>
	<g stroke="#55f1a3" stroke-width="2" fill="none">
		<rect x="58" y="272" width="30" height="26" rx="6"/>
		<path d="M 66,281 L 73,289 L 80,281" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
	</g>
	<circle cx="44" cy="316" r="4.5" fill="#55f1a3" stroke="none"/>
	<path d="M 0,0 L 0,17.5 L 4.2,13.4 L 6.9,19.6 L 10.1,18.2 L 7.4,12.1 L 12.6,11.6 Z" fill="#55f1a3" stroke="none" transform="translate(140 316)"/>
</svg>
